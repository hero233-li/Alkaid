name: Package update-only backend temporary

on:
  push:
    branches:
      - agent/code-flow-refactor
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/code-flow-refactor
          fetch-depth: 0

      - name: Build update-only ZIP
        shell: bash
        run: |
          BASE_SHA=bf199853a61ddd3f2d61bcfa2a6a66760843b6c2
          git diff --name-only "$BASE_SHA" HEAD -- Alkaid-python > /tmp/updated-files.txt
          test -s /tmp/updated-files.txt
          mkdir -p /tmp/update-only
          while IFS= read -r file; do
            test -f "$file" || continue
            mkdir -p "/tmp/update-only/$(dirname "$file")"
            cp "$file" "/tmp/update-only/$file"
          done < /tmp/updated-files.txt
          cp /tmp/updated-files.txt /tmp/update-only/UPDATED_FILES.txt
          cat > /tmp/update-only/APPLY_README.txt <<'EOF'
          基线：此前发送的完整 Alkaid-python 后端 ZIP。
          用法：解压到原仓库根目录，保持 Alkaid-python/... 路径并覆盖同名文件。
          内容：仅包含 UAT1/UAT2/UATC 环境统一和产品级必填规则修复文件。
          EOF
          cd /tmp/update-only
          zip -r "$GITHUB_WORKSPACE/Alkaid-backend-update-UAT-requiredness.zip" .

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Alkaid-backend-update-UAT-requiredness
          path: Alkaid-backend-update-UAT-requiredness.zip
          if-no-files-found: error
          retention-days: 2
