name: Fix environment and requiredness temporary

on:
  push:
    branches:
      - agent/code-flow-refactor
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/code-flow-refactor
          fetch-depth: 0

      - name: Apply focused backend fix
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          root = Path('Alkaid-python')
          env_map = {'env-1': 'UAT1', 'env-2': 'UAT2', 'env-3': 'UATC'}

          reference_path = root / 'apps/product_data/configs/reference_data.json'
          reference = json.loads(reference_path.read_text(encoding='utf-8'))
          reference['version'] = max(int(reference.get('version', 0)) + 1, 7)
          reference['environments'] = [
              {'label': 'UAT1', 'value': 'UAT1'},
              {'label': 'UAT2', 'value': 'UAT2'},
              {'label': 'UATC', 'value': 'UATC'},
          ]
          reference_path.write_text(
              json.dumps(reference, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )

          for product_path in sorted((root / 'apps/product_data/configs/products').glob('*.json')):
              product = json.loads(product_path.read_text(encoding='utf-8'))
              product['environments'] = [env_map.get(value, value) for value in product['environments']]
              for route in (product.get('features') or {}).get('applicationLinks') or []:
                  route['environment'] = env_map.get(route.get('environment'), route.get('environment'))
              product_path.write_text(
                  json.dumps(product, ensure_ascii=False, indent=2) + '\n',
                  encoding='utf-8',
              )

          replacements = {
              root / '.env.example': [
                  (
                      'APPLICATION_LINK_BASE_URLS={"uat1":"http://link-uat1-host:8090","uat2":"http://link-uat2-host:8090"}',
                      'APPLICATION_LINK_BASE_URLS={"UAT1":"http://link-uat1-host:8090","UAT2":"http://link-uat2-host:8090","UATC":"http://link-uatc-host:8090"}',
                  ),
                  (
                      'CJDK_JYRC_BASE_URLS={"uat1":"http://uat1-host:8090","uat2":"http://uat2-host:8090"}',
                      'CJDK_JYRC_BASE_URLS={"UAT1":"http://uat1-host:8090","UAT2":"http://uat2-host:8090","UATC":"http://uatc-host:8090"}',
                  ),
              ],
              root / '.env.server.example': [
                  (
                      'APPLICATION_LINK_BASE_URLS={"uat1":"http://link-uat1-host:8090","uat2":"http://link-uat2-host:8090"}',
                      'APPLICATION_LINK_BASE_URLS={"UAT1":"http://link-uat1-host:8090","UAT2":"http://link-uat2-host:8090","UATC":"http://link-uatc-host:8090"}',
                  ),
                  (
                      'CJDK_JYRC_BASE_URLS={"uat1":"http://uat1-host:8090","uat2":"http://uat2-host:8090"}',
                      'CJDK_JYRC_BASE_URLS={"UAT1":"http://uat1-host:8090","UAT2":"http://uat2-host:8090","UATC":"http://uatc-host:8090"}',
                  ),
              ],
          }
          for path, items in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in items:
                  if old not in text and new not in text:
                      raise RuntimeError(f'expected text not found in {path}: {old}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')

          config_path = root / 'apps/integrations/cjdk_jyrc/config.py'
          config_text = config_path.read_text(encoding='utf-8')
          config_text = config_text.replace(
              'normalized = environment.strip().lower()',
              'normalized = environment.strip().upper()',
          )
          config_text = config_text.replace(
              'normalized_key = str(key).strip().lower()',
              'normalized_key = str(key).strip().upper()',
          )
          config_path.write_text(config_text, encoding='utf-8')

          catalog_path = root / 'apps/product_data/catalog.py'
          catalog_text = catalog_path.read_text(encoding='utf-8')
          old_method = '''    def as_ui_field(self, method_code: str) -> ProductField:\n        content = self.model_dump(\n            exclude={"group", "enabledFor", "requiredFor", "expose", "execution"}\n        )\n        content["required"] = self.required_for(method_code)\n        return ProductField.model_validate(content)\n'''
          new_method = '''    def as_ui_field(self) -> ProductField:\n        """Return product-neutral control metadata.\n\n        Requiredness belongs to ProductDefinition.requiredFields and the frozen\n        ProductExecutionSnapshot, never to the shared field descriptor.\n        """\n        content = self.model_dump(\n            exclude={"group", "enabledFor", "requiredFor", "expose", "execution"}\n        )\n        content["required"] = False\n        return ProductField.model_validate(content)\n'''
          if old_method not in catalog_text and new_method not in catalog_text:
              raise RuntimeError('CatalogField.as_ui_field block not found')
          catalog_text = catalog_text.replace(old_method, new_method)
          catalog_text = catalog_text.replace(
              'ui_field = field.as_ui_field(product.defaultApplicationMethod)',
              'ui_field = field.as_ui_field()',
          )
          catalog_path.write_text(catalog_text, encoding='utf-8')

          services_path = root / 'apps/product_data/product_applications/services.py'
          services_text = services_path.read_text(encoding='utf-8')
          services_text = services_text.replace(
              'from apps.integrations.cjdk_jyrc.config import is_configured_environment\n',
              '',
          )
          old_catalog_block = '''    product = None\n    if catalog is not None:\n        try:\n            product = catalog.product(submission.product)\n        except ValueError as exc:\n            raise ProductConfigurationError(f"未知产品：{submission.product}") from exc\n\n    payload = submission.payload\n'''
          new_catalog_block = '''    resolved_catalog = catalog or load_product_catalog()\n    try:\n        product = resolved_catalog.product(submission.product)\n    except ValueError as exc:\n        raise ProductConfigurationError(f"未知产品：{submission.product}") from exc\n\n    payload = submission.payload\n'''
          if old_catalog_block not in services_text and new_catalog_block not in services_text:
              raise RuntimeError('services catalog block not found')
          services_text = services_text.replace(old_catalog_block, new_catalog_block)

          old_environment_block = '''    environment = payload.get("environment")\n    if (\n        product is not None\n        and environment not in product.environments\n        and not is_configured_environment(str(environment or ""))\n    ):\n        raise ProductConfigurationError("当前环境不支持该产品，或未配置对应基础地址")\n\n'''
          new_environment_block = '''    environment = normalize_environment(\n        payload.get("environment"),\n        resolved_catalog,\n    )\n    payload["environment"] = environment\n    if environment not in product.environments:\n        raise ProductConfigurationError("当前环境不支持该产品")\n\n'''
          if old_environment_block not in services_text and new_environment_block not in services_text:
              raise RuntimeError('services environment block not found')
          services_text = services_text.replace(old_environment_block, new_environment_block)
          services_text = services_text.replace(
              '''    if product is not None:\n        _validate_location_hierarchy(product.locations, payload)\n''',
              '''    _validate_location_hierarchy(product.locations, payload)\n''',
          )

          insert_before = '\ndef validate_customer_type(payload: dict[str, Any]) -> CustomerType:\n'
          normalize_function = '''\ndef normalize_environment(value: object, catalog: ProductCatalog) -> str:\n    if not isinstance(value, str) or not value.strip():\n        raise ProductConfigurationError("环境不能为空")\n\n    normalized = value.strip().upper()\n    for option in catalog.reference.environments:\n        if normalized in {option.value.upper(), option.label.upper()}:\n            return option.value\n\n    allowed = ", ".join(option.value for option in catalog.reference.environments)\n    raise ProductConfigurationError(f"环境必须是以下值之一：{allowed}")\n\n'''
          if normalize_function not in services_text:
              if insert_before not in services_text:
                  raise RuntimeError('validate_customer_type anchor not found')
              services_text = services_text.replace(insert_before, normalize_function + insert_before)
          services_path.write_text(services_text, encoding='utf-8')

          test_flow_path = root / 'tests/test_product_application_flow.py'
          test_flow_text = test_flow_path.read_text(encoding='utf-8')
          test_flow_text = test_flow_text.replace('"environment": "env-1"', '"environment": "UAT1"')
          test_flow_text = test_flow_text.replace(
              '''    CJDK_JYRC_BASE_URLS={\n        "uat1": "http://uat1.example:8090/",\n        "uat2": "http://uat2.example:8091",\n    },\n    APPLICATION_LINK_BASE_URLS={\n        "uat1": "http://link-uat1.example:8080/",\n        "uat2": "http://link-uat2.example:8081",\n    },\n''',
              '''    CJDK_JYRC_BASE_URLS={\n        "UAT1": "http://uat1.example:8090/",\n        "UAT2": "http://uat2.example:8091",\n        "UATC": "http://uatc.example:8092",\n    },\n    APPLICATION_LINK_BASE_URLS={\n        "UAT1": "http://link-uat1.example:8080/",\n        "UAT2": "http://link-uat2.example:8081",\n        "UATC": "http://link-uatc.example:8082",\n    },\n''',
          )
          test_flow_text = test_flow_text.replace(
              '''    assert resolve_application_link_base_url("UAT2") == "http://link-uat2.example:8081"\n''',
              '''    assert resolve_application_link_base_url("UAT2") == "http://link-uat2.example:8081"\n    assert resolve_base_url("uatc") == "http://uatc.example:8092"\n    assert resolve_application_link_base_url("uatc") == "http://link-uatc.example:8082"\n''',
          )
          required_test = '''\n\ndef test_requiredness_is_not_stored_on_global_ui_field() -> None:\n    from apps.product_data.catalog import CatalogField\n\n    required_for_product = CatalogField(\n        name="sharedField",\n        group="base",\n        requiredFor=("*",),\n    )\n    optional_for_product = CatalogField(\n        name="sharedField",\n        group="base",\n    )\n\n    assert required_for_product.required_for("normal") is True\n    assert optional_for_product.required_for("normal") is False\n    assert required_for_product.as_ui_field() == optional_for_product.as_ui_field()\n    assert required_for_product.as_ui_field().required is False\n'''
          if 'def test_requiredness_is_not_stored_on_global_ui_field' not in test_flow_text:
              test_flow_text += required_test
          test_flow_path.write_text(test_flow_text, encoding='utf-8')

          test_api_path = root / 'tests/test_api.py'
          test_api_text = test_api_path.read_text(encoding='utf-8')
          test_api_text = test_api_text.replace('"environment": "env-1"', '"environment": "uat1"')
          test_api_text = test_api_text.replace(
              '    assert job.execution_config_snapshot["product_code"] == "product-b"\n',
              '    assert job.execution_config_snapshot["product_code"] == "product-b"\n    assert job.payload["environment"] == "UAT1"\n',
          )
          test_api_path.write_text(test_api_text, encoding='utf-8')

          # Focused structural checks that do not need project dependencies.
          expected_environments = ['UAT1', 'UAT2', 'UATC']
          assert [item['value'] for item in reference['environments']] == expected_environments
          for product_path in sorted((root / 'apps/product_data/configs/products').glob('*.json')):
              product = json.loads(product_path.read_text(encoding='utf-8'))
              assert product['environments'] == expected_environments
              assert {
                  route['environment']
                  for route in (product.get('features') or {}).get('applicationLinks') or []
              } <= set(expected_environments)
          assert 'content["required"] = False' in catalog_path.read_text(encoding='utf-8')
          assert 'payload["environment"] = environment' in services_path.read_text(encoding='utf-8')
          PY

      - name: Commit focused backend changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Alkaid-python
          if git diff --cached --quiet; then
            echo "No backend changes to commit"
          else
            git commit -m "fix: unify environments and keep requiredness product-local"
            git push origin HEAD:agent/code-flow-refactor
          fi

      - name: Build update-only ZIP
        shell: bash
        run: |
          BASE_SHA=bf199853a61ddd3f2d61bcfa2a6a66760843b6c2
          git diff --name-only "$BASE_SHA" HEAD -- Alkaid-python > /tmp/backend-update-files.txt
          test -s /tmp/backend-update-files.txt
          mkdir -p /tmp/backend-update
          while IFS= read -r file; do
            test -f "$file" || continue
            mkdir -p "/tmp/backend-update/$(dirname "$file")"
            cp "$file" "/tmp/backend-update/$file"
          done < /tmp/backend-update-files.txt
          cp /tmp/backend-update-files.txt /tmp/backend-update/UPDATED_FILES.txt
          cat > /tmp/backend-update/APPLY_README.txt <<'EOF'
          基线：此前发送的完整 Alkaid-python 后端 ZIP。
          用法：将本 ZIP 解压到原仓库根目录，保持 Alkaid-python/... 路径并覆盖同名文件。
          本包只包含本次“UAT1/UAT2/UATC 环境统一 + 产品级必填规则修复”的更新文件。
          EOF
          cd /tmp/backend-update
          zip -r "$GITHUB_WORKSPACE/Alkaid-backend-update-UAT-requiredness.zip" .

      - name: Upload update-only ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Alkaid-backend-update-UAT-requiredness
          path: Alkaid-backend-update-UAT-requiredness.zip
          if-no-files-found: error
          retention-days: 2
