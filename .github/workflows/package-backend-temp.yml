name: Package backend temporary

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - agent/code-flow-refactor
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Write package metadata
        shell: bash
        run: |
          cat > Alkaid-python/PACKAGE_INFO.txt <<'EOF'
          Repository: hero233-li/Alkaid
          Branch: agent/code-flow-refactor
          Package: complete Alkaid-python backend directory
          Generated by temporary GitHub Actions workflow
          EOF
          printf 'Commit: %s\n' "$GITHUB_SHA" >> Alkaid-python/PACKAGE_INFO.txt

      - name: Create ZIP
        shell: bash
        run: zip -r Alkaid-backend-agent-code-flow-refactor.zip Alkaid-python -x '*/.venv/*' '*/__pycache__/*' '*.pyc' '*.sqlite3' '*/node_modules/*'

      - name: Upload backend ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Alkaid-backend-agent-code-flow-refactor
          path: Alkaid-backend-agent-code-flow-refactor.zip
          if-no-files-found: error
          retention-days: 1
